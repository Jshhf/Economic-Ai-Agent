{% extends "base.html" %}
{% block content %}
<section class="job-head">
  <div>
    <p class="eyebrow">Job Detail</p>
    <h2>{{ job_id }}</h2>
    <p class="lede">页面会自动刷新任务状态，并在完成后展示报告、图表和工具调用轨迹。</p>
  </div>
  <div class="action-row">
    <a class="ghost-button" href="/jobs/{{ job_id }}/report">单独查看报告</a>
  </div>
</section>

<section
  id="job-panel"
  hx-get="/jobs/{{ job_id }}/panel"
  hx-trigger="load, every 2s"
  hx-swap="innerHTML"
  class="panel-shell"
>
  <div class="status-card">正在加载任务状态...</div>
</section>
{% endblock %}
