{% extends "base.html" %}
{% block content %}
<section class="job-head">
  <div>
    <p class="eyebrow">Job Detail</p>
    <h2>{{ job_id }}</h2>
    <p class="lede">
      The panel refreshes automatically and shows skill selection, agent traces, tool/RAG/MCP calls, metrics, and report artifacts.
    </p>
  </div>
  <div class="action-row">
    <span class="chip">{{ job.skill_id }}</span>
    <a class="ghost-button" href="/jobs/{{ job_id }}/report">Open final report</a>
  </div>
</section>

<section
  id="job-panel"
  hx-get="/jobs/{{ job_id }}/panel"
  hx-trigger="load, every 2s"
  hx-swap="innerHTML"
  class="panel-shell"
>
  <div class="status-card">Loading job status...</div>
</section>
{% endblock %}
